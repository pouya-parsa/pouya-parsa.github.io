name: Daily SEO and GEO monitor

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-site-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_BASE_URL: https://pouya-parsa.github.io/
      SITE_CANONICAL_BASE_URL: https://pouya-parsa.github.io/
      LHCI_BASE_URL: https://pouya-parsa.github.io/

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install monitoring dependencies
        run: npm ci

      - name: Run repository tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Audit live site
        id: site_audit
        continue-on-error: true
        run: npm run monitor:site

      - name: Collect Lighthouse runs
        id: lighthouse_collect
        if: always()
        continue-on-error: true
        run: npm run monitor:lighthouse:collect

      - name: Save Lighthouse reports
        id: lighthouse_upload
        if: always()
        continue-on-error: true
        run: npm run monitor:lighthouse:upload

      - name: Assert Lighthouse thresholds
        id: lighthouse_assert
        if: always()
        continue-on-error: true
        run: npm run monitor:lighthouse:assert

      - name: Summarize Lighthouse results
        id: lighthouse_summary
        if: always()
        continue-on-error: true
        run: npm run monitor:lighthouse:summary

      - name: Publish monitoring summary
        if: always()
        shell: bash
        run: |
          echo "# Daily SEO and GEO monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f .monitoring/site-audit.md ]]; then
            cat .monitoring/site-audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Live-site audit" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Overall: FAIL** — no live-site report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f .monitoring/lighthouse-summary.md ]]; then
            cat .monitoring/lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Lighthouse mobile audit" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Overall: FAIL** — no Lighthouse summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload monitoring artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-monitor-${{ github.run_id }}
          path: |
            .monitoring/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Apply final monitoring gate
        if: always()
        shell: bash
        env:
          TESTS: ${{ steps.tests.outcome }}
          SITE_AUDIT: ${{ steps.site_audit.outcome }}
          LIGHTHOUSE_COLLECT: ${{ steps.lighthouse_collect.outcome }}
          LIGHTHOUSE_UPLOAD: ${{ steps.lighthouse_upload.outcome }}
          LIGHTHOUSE_ASSERT: ${{ steps.lighthouse_assert.outcome }}
          LIGHTHOUSE_SUMMARY: ${{ steps.lighthouse_summary.outcome }}
        run: |
          failed=0
          for outcome in \
            "$TESTS" \
            "$SITE_AUDIT" \
            "$LIGHTHOUSE_COLLECT" \
            "$LIGHTHOUSE_UPLOAD" \
            "$LIGHTHOUSE_ASSERT" \
            "$LIGHTHOUSE_SUMMARY"
          do
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required monitoring stages failed."
            exit 1
          fi

  traffic-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install monitoring dependencies
        run: npm ci

      - name: Authenticate to Google
        id: google_auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false

      - name: Build traffic report
        id: traffic
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SEARCH_CONSOLE_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_SITE_TAG }}
          CLOUDFLARE_ANALYTICS_DATASET: ${{ vars.CLOUDFLARE_ANALYTICS_DATASET }}
        run: npm run monitor:traffic

      - name: Publish traffic summary
        if: always()
        shell: bash
        run: |
          if [[ -f .monitoring/traffic-report.md ]]; then
            cat .monitoring/traffic-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Traffic and search performance" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Overall: DATA UNAVAILABLE** — no report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload traffic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: traffic-report-${{ github.run_id }}
          path: |
            .monitoring/traffic-report.json
            .monitoring/traffic-report.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Apply traffic-report gate
        if: always()
        shell: bash
        env:
          GOOGLE_AUTH: ${{ steps.google_auth.outcome }}
          TRAFFIC: ${{ steps.traffic.outcome }}
        run: |
          if [[ "$GOOGLE_AUTH" != "success" || "$TRAFFIC" != "success" ]]; then
            echo "Traffic reporting failed; the independent site-health job may still pass."
            exit 1
          fi
